plugins {
    id 'java-library'
    id 'maven-publish'
    id 'io.freefair.lombok'
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Prefer the package-read token for dependency resolution; publishing credentials are unchanged.
// Locally, GITHUB_TOKEN is a fallback. The PAT needs read:packages and ministryofjustice access.
def githubPackagesUsername = System.getenv('GITHUB_ACTOR')?.trim() ?: project.ext.gitHubPackagesUsername
def githubPackagesPassword = System.getenv('GITHUB_PACKAGES_TOKEN')?.trim() ?: project.ext.gitHubPackagesPassword


// Explicit fallbacks for private artifacts. The plugin's org-level GitHub Packages repository is
// tried first; these group-scoped repositories avoid relying on it accepting a different repo path.
repositories {
    maven {
        name = 'laaDataProviderData'
        url = uri('https://maven.pkg.github.com/ministryofjustice/laa-data-provider-data')
        credentials {
            username = githubPackagesUsername
            password = githubPackagesPassword
        }
        content {
            includeGroup 'uk.gov.justice.laadata.providers'
        }
    }

    maven {
        name = 'laaDataClaimsApi'
        url = uri('https://maven.pkg.github.com/ministryofjustice/laa-data-claims-api')
        credentials {
            username = githubPackagesUsername
            password = githubPackagesPassword
        }
        content {
            includeGroup 'uk.gov.justice.laa.datastewardship.payments'
        }
    }
}

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {

    implementation project(':reference-fee-scheme-platform-api')

    implementation 'uk.gov.justice.laa.datastewardship.payments:data-claims-api-models:1.22.10'
    implementation 'uk.gov.justice.laadata.providers:providers-api:1.55.2'

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.data:spring-data-commons'
    implementation 'org.apache.commons:commons-lang3:3.21.0'
    implementation 'com.networknt:json-schema-validator:1.5.8'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.55'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-reactor:2.4.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation("io.projectreactor:reactor-test:3.8.7")
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    finalizedBy jacocoTestReport
}

tasks.register("checkstyleStaged", Checkstyle) {
    group = "verification"
    description = "Runs Checkstyle on staged files only"

    def filesToCheck = project.findProperty("checkstyleFiles")
    if (filesToCheck != null) {
        source = files(filesToCheck.split(","))
    } else {
        source = sourceSets.main.allJava
    }

    classpath = sourceSets.main.compileClasspath
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = project.name
        }
    }
}

// This module publishes a library, not an executable Spring Boot application.
tasks.named('bootJar') {
    enabled = false
}

tasks.named('bootRun') {
    enabled = false
}

tasks.named('jar') {
    enabled = true
}
